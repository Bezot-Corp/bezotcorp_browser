[package]
name = "bezotcorp_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
# fenêtre et événements
winit = "0.30.13"
euclid = "0.22.14"

# GPU rendering — wgpu retiré, on passe par vello::wgpu (wgpu 29.x)
vello = "0.9"

# texte
cosmic-text = "0.19"
parley = "0.10"

# SVG
resvg = "0.47"
usvg = "0.47"

# réseau async
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["gzip", "brotli"] }

# utils
url = "2.5"
ron.workspace = true
serde = { workspace = true }
tracing = "0.1.44"
thiserror = "2.0.18"

rustls = "0.23.40"

# servo retiré temporairement — bug surfman-0.12.4 sur Linux/Wayland
# réintégrer quand https://github.com/servo/surfman sera corrigé
# servo = "0.2.0"
